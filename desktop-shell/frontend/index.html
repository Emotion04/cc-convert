<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CC Convert — Manager 未运行</title>
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: #171717; color: #e7e5e4;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { max-width: 460px; text-align: center; padding: 40px; }
  h1 { font-size: 18px; } p { color: #a8a29e; font-size: 13px; line-height: 1.8; }
  code { background: #262626; padding: 2px 6px; border-radius: 6px; }
  button { margin-top: 16px; padding: 10px 22px; border: 0; border-radius: 10px; cursor: pointer;
           background: #F97316; color: #fff; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <h1>Manager 未运行</h1>
    <p>桌面壳启动 Manager 失败或超时。<br>
       可以手动执行 <code>ccconvert start</code> 后点击重试；<br>
       源码运行时请先 <code>uv sync</code> 并确认 <code>ccconvert</code> 命令可用。</p>
    <button onclick="location.reload()">重试</button>
  </div>
</body>
</html>
