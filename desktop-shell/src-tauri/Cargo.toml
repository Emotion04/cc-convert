[package]
name = "ccconvert-desktop"
version = "0.1.0"
edition = "2021"
description = "CC Convert desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
toml = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
