name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    # Windows: the portable zip and the NSIS installer are Windows-only
    # artifacts. The wheel is platform-independent (py3-none-any), so one
    # runner covers every release asset.
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine pyinstaller

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Publish to PyPI
      # Optional channel: without a configured Trusted Publisher this step
      # fails, but the Release below still carries the assets so users can
      # install straight from GitHub. Never block the release on it.
      continue-on-error: true
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

    - name: Build Manager executable (PyInstaller onedir)
      run: pyinstaller ccconvert.spec --noconfirm --clean

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build desktop shell (Tauri bundle)
      working-directory: desktop-shell
      run: |
        npm ci
        npx tauri build

    - name: Pack portable zip
      run: python build_tools/pack_desktop.py

    - name: Extract release notes
      id: changelog
      shell: bash
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        sed -n "/^## \[$VERSION\]/,/^---/p" CHANGELOG.md | sed '$d' | sed '$d' > /tmp/release_notes.md
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        body_path: /tmp/release_notes.md
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
        files: |
          dist/*.whl
          dist/*.tar.gz
          dist-release/*.zip
          desktop-shell/src-tauri/target/release/bundle/nsis/*.exe
