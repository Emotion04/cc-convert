[project]
name = "cc-convert"
version = "0.8.0"
description = "A bidirectional API protocol converter between Anthropic Messages API and OpenAI API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
keywords = ["anthropic", "openai", "api", "proxy", "messages", "claude", "converter", "responses", "streaming", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.100.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.6",
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tiktoken>=0.7.0",
    "tomli-w>=1.0.0",
    "uvicorn[standard]>=0.23.0",
    "anthropic>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
ccconvert = "cc_convert.main:main"

[project.urls]
Homepage = "https://github.com/Emotion04/cc-convert"
Repository = "https://github.com/Emotion04/cc-convert"
Issues = "https://github.com/Emotion04/cc-convert/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_convert"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pytest-cov>=7.1.0",
]
